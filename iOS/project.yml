name: ClipBubble
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio
    from: 2.81.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    from: 0.15.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BHAM5T9649
    CODE_SIGN_STYLE: Automatic
# The app, share extension and keyboard share the engine, store and both transports.
targetTemplates:
  Synced:
    # On the targets, not the project: XcodeGen's iOS preset sets "1,2" on every target, which made it an iPad app too.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - Shared
      - ../Sources/Sync.swift
      - ../Sources/Store.swift
      - ../Sources/Link.swift
      - ../Sources/DirectIdentity.swift
      - ../Sources/DirectPeers.swift
      - ../Sources/DirectTransport.swift
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - sdk: libsqlite3.tbd
    entitlements:
      path: ${target_name}.entitlements
      properties:
        com.apple.security.application-groups: [group.studio.krnl.clipbubble]
targets:
  ClipBubble:
    type: application
    platform: iOS
    templates: [Synced]
    sources: [Sources]
    dependencies:
      - target: ClipBubbleShare
      - target: ClipBubbleKeyboard
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ClipBubble finds nearby computers and syncs your clipboard over a direct, encrypted connection.
        NSBonjourServices: ["_clipbubble._tcp"]
        NSCameraUsageDescription: To scan the code your computer shows when you link this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: studio.krnl.clipbubble
            CFBundleURLSchemes: [clipbubble]
    # Run from Xcode buys Pro from ClipBubble.storekit instead of the App Store.
    scheme:
      storeKitConfiguration: ClipBubble.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble
  ClipBubbleShare:
    type: app-extension
    platform: iOS
    templates: [Synced]
    sources: [Share]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ClipBubble finds nearby computers and syncs your clipboard over a direct, encrypted connection.
        NSBonjourServices: ["_clipbubble._tcp"]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble.share
        # Only the main app declares App Intents.
        LM_SKIP_METADATA_EXTRACTION: YES
  ClipBubbleKeyboard:
    type: app-extension
    platform: iOS
    templates: [Synced]
    sources: [Keyboard]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: ClipBubble
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: ClipBubble finds nearby computers and syncs your clipboard over a direct, encrypted connection.
        NSBonjourServices: ["_clipbubble._tcp"]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.krnl.clipbubble.keyboard
        LM_SKIP_METADATA_EXTRACTION: YES
